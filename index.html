<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050713" />
  <meta name="description" content="서울 여의도 밤하늘을 배경으로 즐기는 인터랙티브 불꽃놀이." />
  <title>SEOUL FIREWORKS — Yeouido</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="scene">
    <picture class="photo" aria-hidden="true">
      <source media="(max-width: 700px)" srcset="./background-mobile.png" />
      <img src="./background-desktop.png" alt="" />
    </picture>

    <div class="scene-tone" aria-hidden="true"></div>
    <div class="content-scrim" aria-hidden="true"></div>
    <canvas id="fireworks" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">SEOUL <span>/</span> FIREWORKS</div>
      <div class="year">2026</div>
    </header>

    <section class="hero" aria-labelledby="hero-title">
      <p class="eyebrow">SEOUL · HAN RIVER · FIREWORKS 2026</p>
    
      <h1 id="hero-title">
        <span>THE NIGHT</span>
        <strong>SHOW</strong>
      </h1>
    
      <p class="copy">
        한강 위 밤하늘을<br />
        당신의 불꽃으로 물들여보세요.
      </p>
    
      <button id="startBtn" type="button" aria-label="불꽃놀이 시작">
        <span>IGNITE THE SKY</span>
        <b aria-hidden="true">↗</b>
      </button>
    </section>
    

    <div class="location" aria-label="장소: 여의도">
      <span class="pulse" aria-hidden="true"></span>
      <div>
        <strong>YEUIDO</strong>
        <small>37.5283° N · 126.9320° E</small>
      </div>
    </div>

    <div class="show-ui" id="showUi">
      <span>LIVE FIREWORKS</span>
      <strong>LOOK UP.</strong>
      <button id="replayBtn" type="button">REPLAY</button>
    </div>

    <div class="countdown" id="countdown" aria-live="polite">
      <span>THE SHOW STARTS IN</span>
      <strong id="countValue">3</strong>
    </div>
  </main>

  <script src="./main.js"></script>
</body>
</html>
